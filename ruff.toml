# Ruff configuration for all Python code in this repository (apps/api,
# services/*, tests/, scripts/). Run from the repository root.

target-version = "py312"
line-length = 100
# Markdown is excluded: Ruff 0.17 would otherwise reformat code blocks and line
# endings inside the authoritative PRD / architecture documents.
extend-exclude = [".venv", "node_modules", "apps/web", "*.md"]

[lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "SIM",   # flake8-simplify
  "S",     # flake8-bandit (security)
  "ASYNC", # flake8-async
  "RUF",   # ruff-specific
]
ignore = [
  "S105",  # hard-coded-password-string: false positives on env var *names*
]

[lint.per-file-ignores]
"**/tests/**" = [
  "S101",  # assert is the point of a test
  "S106",  # dummy secrets in tests
]

[lint.isort]
known-first-party = ["apps", "services"]

[format]
quote-style = "double"
line-ending = "lf"
