[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "proxylead-backend"
version = "0.1.0"
description = "ProxyLead FastAPI backend: identity, orchestration, ArmorIQ gateway, delivery."
requires-python = ">=3.12,<3.14"
dependencies = [
  "proxylead-contracts==0.1.0",  # installed from ../contracts/python (editable)
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.15.0",
  "anthropic==1.13.0",           # planner/responder (not called yet)
  "armoriq-sdk==0.6.10",         # required pin; imported only by the ArmorIQ gateway
  "slack-bolt==1.30.0",          # Socket Mode bot (not wired yet)
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
