name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Ordinary CI needs no secrets. Nothing here talks to ArmorIQ, Slack,
# Anthropic, or Neon; unit tests never count as live experiment evidence.
env:
  APP_ENV: test
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  contracts:
    name: Contracts (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/python/pyproject.toml
      - run: python -m pip install -e "contracts/python[dev]"
      - name: Lint
        run: ruff check contracts/python && ruff format --check contracts/python
      - name: JSON Schema is up to date
        run: python -m proxylead_contracts.schema_export --check
      - name: Tests
        working-directory: contracts/python
        run: python -m pytest

  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            contracts/python/pyproject.toml
      - run: python -m pip install -e contracts/python -e "backend[dev]"
      - run: python -m pip check
      - name: Lint
        working-directory: backend
        run: ruff check . && ruff format --check .
      - name: Tests
        working-directory: backend
        run: python -m pytest

  mcp-server:
    name: MCP server (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            mcp-server/pyproject.toml
            contracts/python/pyproject.toml
      - run: python -m pip install -e contracts/python -e "mcp-server[dev]"
      - run: python -m pip check
      - name: Lint
        working-directory: mcp-server
        run: ruff check . && ruff format --check .
      - name: Tests
        working-directory: mcp-server
        run: python -m pytest

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated contract types are up to date
        run: npm run gen:types && git diff --exit-code -- src/types/generated
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
