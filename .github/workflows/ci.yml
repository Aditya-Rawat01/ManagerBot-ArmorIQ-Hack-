name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Ordinary CI needs no secrets. Nothing here talks to ArmorIQ, Slack,
# Google Gemini, or Neon; unit tests never count as live experiment evidence.
# Layout: ProxyLead_PRD_v2.md §3.1 / ProxyLead_Architecture_v2.1.md §11.
env:
  APP_ENV: test
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  contracts:
    name: Lint + contracts (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Ruff (whole repository)
        run: ruff check . && ruff format --check .
      - name: JSON Schema is up to date
        run: python -m services.contracts.schema_export --check
      - name: Contract tests
        run: python -m pytest tests/contracts

  api:
    name: apps/api (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Only the API extra: proves the API does not depend on toolserver packages.
      - run: python -m pip install -e ".[api,dev]"
      - run: python -m pip check
      - run: python -m pytest tests/api

  toolserver:
    name: services/toolserver (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Only the toolserver extra: no armoriq-sdk / google-genai / slack-bolt installed.
      - run: python -m pip install -e ".[toolserver,dev]"
      - run: python -m pip check
      - run: python -m pytest tests/toolserver

  web:
    name: apps/web (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated contract types are up to date
        run: npm run gen:types && git diff --exit-code -- src/types/generated
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
